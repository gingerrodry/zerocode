name: Keep Codespace alive

# Codespace は一定期間使われないと削除される。
# 定期的に API で起動して「使用中」の状態にし、削除を防ぐ。
on:
  schedule:
    - cron: "17 3 * * 1"   # 毎週月曜 03:17 UTC
  workflow_dispatch:

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    steps:
      - name: Start codespaces for this repository
        env:
          GH_TOKEN: ${{ secrets.CODESPACES_PAT }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::error::Secret CODESPACES_PAT is not set"; exit 1
          fi
          gh api user -q '"Authenticated as " + .login'
          names=$(gh api "/repos/${GITHUB_REPOSITORY}/codespaces" --paginate -q '.codespaces[].name' 2>/dev/null || true)
          if [ -z "$names" ]; then
            names=$(gh api /user/codespaces --paginate -q ".codespaces[] | select(.repository.full_name==\"${GITHUB_REPOSITORY}\") | .name")
          fi
          [ -n "$names" ] || { echo "No codespaces found for ${GITHUB_REPOSITORY}"; exit 0; }
          for n in $names; do
            echo "Starting $n"
            gh api -X POST "/user/codespaces/$n/start" -q '"state: " + .state'
          done
