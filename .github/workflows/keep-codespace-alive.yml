name: Keep Codespace alive

# Codespace は一定期間使われないと削除される。
# 定期的に起動して「使用中」の状態にし、削除を防ぐ。
on:
  schedule:
    - cron: "17 3 * * 1"   # 毎週月曜 03:17 UTC
  workflow_dispatch:

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    steps:
      - name: Start codespaces for this repository
        env:
          # codespace スコープ付き PAT を Secret に登録（名前: CODESPACES_PAT）
          GH_TOKEN: ${{ secrets.CODESPACES_PAT }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::error::Secret CODESPACES_PAT is not set"; exit 1
          fi
          names=$(gh codespace list --repo "$GITHUB_REPOSITORY" --json name -q '.[].name')
          [ -n "$names" ] || { echo "No codespaces found"; exit 0; }
          for n in $names; do
            echo "Touching $n"
            # SSH でコマンドを実行すると起動し、最終使用時刻が更新される
            gh codespace ssh -c "$n" -- "echo alive: \$(date -u)"
          done
